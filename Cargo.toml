[package]
name = "deka-validation"
version = "0.2.0"
edition = "2021"
authors = ["Sami Fouad"]
description = "Validation and error formatting shared by the deka runtime and the dsc compiler"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dekaruntime/deka-validation"
keywords = ["deka", "dsc", "validation", "diagnostics", "wasm"]
categories = ["command-line-interface", "development-tools"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[profile.release]
# Optimize for size when building WASM
opt-level = "s"
lto = true
